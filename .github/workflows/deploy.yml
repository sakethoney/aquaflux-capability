name: Deploy

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform action'
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  TF_DIR: infrastructure/terraform

jobs:
  terraform:
    name: Terraform ${{ inputs.terraform_action }}
    runs-on: ubuntu-latest
    outputs:
      ecr_url:                  ${{ steps.tf_output.outputs.ecr_repository_url }}
      ecs_cluster:              ${{ steps.tf_output.outputs.ecs_cluster_name }}
      ecs_service:              ${{ steps.tf_output.outputs.ecs_service_name }}
      frontend_bucket:          ${{ steps.tf_output.outputs.frontend_bucket }}
      cloudfront_distribution:  ${{ steps.tf_output.outputs.cloudfront_distribution_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: inputs.terraform_action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Capture outputs
        id: tf_output
        if: inputs.terraform_action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster_name=$(terraform output -raw ecs_cluster_name)"     >> "$GITHUB_OUTPUT"
          echo "ecs_service_name=$(terraform output -raw ecs_service_name)"     >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)"       >> "$GITHUB_OUTPUT"
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

  backend:
    name: Build and deploy backend
    needs: terraform
    if: inputs.terraform_action == 'apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build jar
        working-directory: backend/spring-boot-app
        run: mvn package -DskipTests

      - name: Build and push Docker image
        working-directory: backend/spring-boot-app
        env:
          ECR_URL: ${{ needs.terraform.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_URL:$IMAGE_TAG" -t "$ECR_URL:latest" .
          docker push "$ECR_URL:$IMAGE_TAG"
          docker push "$ECR_URL:latest"

      - name: Force ECS deploy with new image
        env:
          CLUSTER: ${{ needs.terraform.outputs.ecs_cluster }}
          SERVICE: ${{ needs.terraform.outputs.ecs_service }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --query 'service.serviceArn' \
            --output text

  frontend:
    name: Build and deploy frontend
    needs: terraform
    if: inputs.terraform_action == 'apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload to S3
        working-directory: frontend/dist/angular-node-app/browser
        env:
          BUCKET: ${{ needs.terraform.outputs.frontend_bucket }}
        run: |
          aws s3 sync . "s3://$BUCKET" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        env:
          DIST_ID: ${{ needs.terraform.outputs.cloudfront_distribution }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"
